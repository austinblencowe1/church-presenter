name: Build macOS installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build universal macOS app and DMG
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Google Drive client secret
        env:
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "$GDRIVE_CLIENT_SECRET" ]; then
            echo "::error::Add the GDRIVE_CLIENT_SECRET Actions secret in repository settings."
            exit 1
          fi
          printf '%s\n' "$GDRIVE_CLIENT_SECRET" > src-tauri/gdrive-client-secret.txt

      - name: Build universal app and DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos.conf.json

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Church-Presenter-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
