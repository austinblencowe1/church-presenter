<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;cursor:default}
#stage{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#000}
#stage .cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#000}
#stage .transition-slide{z-index:2}
#stage .embed-el,#stage .embed-el iframe{pointer-events:auto!important}
#stage .sl{position:relative;width:100%;height:100%;overflow:hidden;background:#000;aspect-ratio:auto;container-type:inline-size;font-size:1cqw}
#stage .bgl,#stage .dim,#stage .tx,#stage .ov{position:absolute;inset:0}
#stage .dim{background:#000;pointer-events:none}
#stage .bgl>img,#stage .bgl>video,#stage .vslot,#stage .vslot video,#stage .bg-video{width:100%;height:100%;object-fit:cover;display:block}
#stage .tx{display:flex;padding:6% 8%;color:#fff;white-space:pre-line;line-height:1.28;box-sizing:border-box}
#stage .slide-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:4}
#stage .wave{background:linear-gradient(120deg,#0b3b6b,#1b7fa8,#0b3b6b,#143d5f);background-size:300% 300%}
#stage .el{position:absolute;box-sizing:border-box;transform-origin:center center;pointer-events:none;user-select:none}
#stage .el.text-el{display:flex;padding:2%;color:#fff;white-space:pre-wrap;line-height:1.28;overflow:hidden;word-break:normal;overflow-wrap:normal}
#stage .el.img-el img{width:100%;height:100%;object-fit:fill;pointer-events:none;display:block}
#stage .el-tx{width:100%;display:block}
#stage .handle{display:none}
#stage .song-credits{pointer-events:none}
#clear{position:fixed;inset:0;z-index:50;display:none;pointer-events:none}
#clear.on{display:block}
#clear.black{background:#000}
#clear.white{background:#fff}
#clear.logo{background:#0a1428;display:flex;align-items:center;justify-content:center}
#clear.logo img{max-width:80%;max-height:80%;object-fit:contain}
.wait{color:#555;font-size:22px;padding:48px;text-align:center;cursor:default}
#preload-bin{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.audience-frozen *{animation-play-state:paused!important;caret-color:transparent!important}
</style>
</head>
<body tabindex="0">
<div id="stage" tabindex="-1"><div class="wait">Waiting for slides…</div></div>
<div id="clear" aria-hidden="true"></div>
<div id="preload-bin" aria-hidden="true"></div>
<script>
(function () {
  var stage = document.getElementById('stage');
  var clearEl = document.getElementById('clear');
  var preloadBin = document.getElementById('preload-bin');
  var last = '';
  var lastClr = '';
  var lastBgKey = '';
  var keptVideo = null;
  var preloaded = {};
  var bc = null;
  var gotBc = false;
  var isFrozen = false;
  var pendingStage = null;
  var pendingClear = null;
  var frozenMedia = [];
  var presentId = new URLSearchParams(location.search).get('presentId') || '';
  window.addEventListener('blur', function () {
    window.setTimeout(function () {
      var active = document.activeElement;
      if (active instanceof HTMLIFrameElement && active.matches('.embed-el iframe[data-provider]')) {
        stage.focus({ preventScroll: true });
      }
    }, 50);
  });
  var slideSizeObserver = typeof ResizeObserver === 'function'
    ? new ResizeObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        entries[i].target.style.fontSize = (entries[i].contentRect.width / 100) + 'px';
      }
    })
    : null;

  function fitSlideFontSize(slide) {
    var width = slide.getBoundingClientRect().width;
    if (width > 0) slide.style.fontSize = (width / 100) + 'px';
    if (slideSizeObserver) slideSizeObserver.observe(slide);
  }

  if (!slideSizeObserver) {
    window.addEventListener('resize', function () {
      var slides = stage.querySelectorAll('.sl');
      for (var i = 0; i < slides.length; i++) fitSlideFontSize(slides[i]);
    });
  }

  function playBg(v) {
    if (!v) return;
    v.muted = true; v.loop = true; v.playsInline = true;
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  }

  function playVideos(root) {
    var scope = root || stage;
    var videos = scope.querySelectorAll('video');
    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      var volume = parseFloat(v.getAttribute('data-vol'));
      if (!isNaN(volume)) v.volume = Math.max(0, Math.min(1, volume));
      if (v.classList.contains('bg-video')) playBg(v);
      else if (v.hasAttribute('autoplay')) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    }
    var audios = scope.querySelectorAll('audio[autoplay]');
    for (var j = 0; j < audios.length; j++) {
      var a = audios[j], volume = parseFloat(a.getAttribute('data-vol'));
      if (!isNaN(volume)) a.volume = Math.max(0, Math.min(1, volume));
      var playing = a.play(); if (playing && playing.catch) playing.catch(function () {});
    }
  }

  function syncEmbedPlayers(root) {
    if (!root) return;
    var frames = root.querySelectorAll('.embed-el iframe[data-provider]');
    for (var i = 0; i < frames.length; i++) {
      (function (frame) {
        var provider = frame.getAttribute('data-provider');
        var muted = frame.getAttribute('data-muted') === '1';
        var volume = Math.round(Math.max(0, Math.min(1, Number(frame.getAttribute('data-volume')) || 0)) * 100);
        var send = function (method, value) {
          if (!frame.contentWindow) return;
          var message = provider === 'YouTube'
            ? { event: 'command', func: method, args: method === 'setVolume' ? [value] : [] }
            : { method: method === 'setVolume' ? 'setVolume' : 'setMuted', value: method === 'setVolume' ? value / 100 : value };
          frame.contentWindow.postMessage(JSON.stringify(message), '*');
        };
        frame.addEventListener('pointerup', function () {
          window.setTimeout(function () {
            if (document.activeElement === frame) stage.focus({ preventScroll: true });
          }, 0);
        });
        [0, 250, 750, 1500, 3000, 5000].forEach(function (delay) {
          window.setTimeout(function () { send('setVolume', volume); send(muted ? 'mute' : 'unMute', muted); }, delay);
        });
      })(frames[i]);
    }
  }

  function playEmbeddedById(elId) {
    var frames = stage.querySelectorAll('.embed-el iframe[data-provider]');
    for (var i = 0; i < frames.length; i++) {
      var frame = frames[i];
      if (frame.getAttribute('data-el') !== elId) continue;
      var command = frame.getAttribute('data-provider') === 'YouTube'
        ? { event: 'command', func: 'playVideo', args: [] }
        : { method: 'play' };
      if (frame.contentWindow) {
        frame.contentWindow.postMessage(JSON.stringify(command), frame.getAttribute('data-provider') === 'YouTube' ? '*' : 'https://player.vimeo.com');
      }
      return;
    }
  }

  function pauseEmbedPlayers(root) {
    if (!root) return;
    var frames = root.querySelectorAll('.embed-el iframe[data-provider]');
    for (var i = 0; i < frames.length; i++) {
      var frame = frames[i];
      var message = frame.getAttribute('data-provider') === 'YouTube'
        ? { event: 'command', func: 'pauseVideo', args: [] }
        : { method: 'pause' };
      if (frame.contentWindow) frame.contentWindow.postMessage(JSON.stringify(message), '*');
    }
  }

  function warmBg(key, url) {
    if (!key || !url || preloaded[key]) return;
    var v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('data-vkey', key);
    v.src = url;
    v.load();
    preloaded[key] = v;
    if (preloadBin) preloadBin.appendChild(v);
  }

  function apply(html, meta) {
    if (html == null || html === '') return;
    if (isFrozen) { pendingStage = { html: html, meta: meta || {} }; return; }
    if (html === last) return;
    last = html;
    meta = meta || {};
    var activeTransition = stage.querySelector('.transition-slide');
    if (activeTransition) {
      if (activeTransition._slideTransitionAnimation) activeTransition._slideTransitionAnimation.cancel();
      var obsolete = stage.firstElementChild;
      if (obsolete && obsolete !== activeTransition && obsolete.parentNode === stage) stage.removeChild(obsolete);
      activeTransition.classList.remove('transition-slide');
      activeTransition.style.opacity = '';
      activeTransition.style.clipPath = '';
      activeTransition.style.transition = '';
    }
    var current = activeTransition || stage.firstElementChild;
    var oldSlideKey = current && current.getAttribute('data-slide-key');
    var template = document.createElement('template');
    template.innerHTML = html;
    var nextSlide = template.content.firstElementChild;
    var transition = nextSlide && nextSlide.getAttribute('data-transition');
    var animate = !!(current && oldSlideKey && nextSlide
      && ['fade', 'wipe-left', 'wipe-right'].indexOf(transition) >= 0
      && nextSlide.getAttribute('data-slide-key') !== oldSlideKey
      && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches));

    var newKeyMatch = html.match(/data-vkey="([^"]+)"/);
    var newKey = meta.bgKey || (newKeyMatch ? newKeyMatch[1] : '');
    var sameBg = meta.sameBg === true || (newKey && newKey === lastBgKey);

    var oldBg = current && current.querySelector('video.bg-video');
    if (!animate && sameBg && oldBg && newKey) {
      keptVideo = oldBg;
      if (oldBg.parentNode) oldBg.parentNode.removeChild(oldBg);
    } else if (keptVideo && (!newKey || newKey !== lastBgKey)) {
      try { if (keptVideo) { keptVideo.pause(); } } catch (e) {}
      keptVideo = null;
    }

    if (animate) {
      stage.appendChild(nextSlide);
      nextSlide.classList.add('transition-slide');
      var outgoingMedia = current.querySelectorAll('video,audio');
      for (var mediaIndex = 0; mediaIndex < outgoingMedia.length; mediaIndex++) {
        try { outgoingMedia[mediaIndex].pause(); } catch (e) {}
      }
      pauseEmbedPlayers(current);
      var duration = Math.max(100, Math.min(1500, parseInt(nextSlide.getAttribute('data-transition-duration'), 10) || 500));
      var frames = transition === 'wipe-left'
        ? [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }]
        : transition === 'wipe-right'
          ? [{ clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0)' }]
          : [{ opacity: 0 }, { opacity: 1 }];
      var finishTransition = function () {
        if (current.parentNode === stage) current.parentNode.removeChild(current);
        nextSlide.classList.remove('transition-slide');
      };
      if (typeof nextSlide.animate === 'function') {
        var animation = nextSlide.animate(frames, { duration: duration, easing: 'ease-in-out' });
        nextSlide._slideTransitionAnimation = animation;
        animation.onfinish = finishTransition;
      } else {
        nextSlide.style.opacity = '0';
        window.requestAnimationFrame(function () {
          nextSlide.style.transition = 'opacity ' + duration + 'ms ease-in-out';
          nextSlide.style.opacity = '1';
        });
        window.setTimeout(finishTransition, duration + 50);
      }
    } else {
      stage.innerHTML = html;
      nextSlide = stage.firstElementChild;
    }
    var slides = nextSlide ? nextSlide.querySelectorAll('.sl') : [];
    for (var slideIndex = 0; slideIndex < slides.length; slideIndex++) fitSlideFontSize(slides[slideIndex]);

    var slot = nextSlide && nextSlide.querySelector('video.bg-video');
    if (!animate && sameBg && keptVideo && slot) {
      slot.parentNode.replaceChild(keptVideo, slot);
      playBg(keptVideo);
    } else if (slot && newKey && preloaded[newKey] && preloaded[newKey] !== slot) {
      var warm = preloaded[newKey];
      try {
        var parent = slot.parentNode;
        var clone = warm.cloneNode(false);
        clone.className = 'bg-video';
        clone.setAttribute('data-vkey', newKey);
        clone.src = warm.src || warm.currentSrc;
        clone.muted = true; clone.loop = true; clone.playsInline = true; clone.autoplay = true;
        parent.replaceChild(clone, slot);
        try { clone.currentTime = 0; } catch (e) {}
        playBg(clone);
        keptVideo = clone;
      } catch (e) {
        playVideos(nextSlide);
      }
    } else {
      keptVideo = slot || null;
      playVideos(nextSlide);
    }
    syncEmbedPlayers(nextSlide);
    lastBgKey = newKey || '';
  }

  function applyClear(mode) {
    mode = mode || '';
    if (isFrozen) { pendingClear = mode; return; }
    if (mode === lastClr) return;
    lastClr = mode;
    clearEl.className = ''; clearEl.innerHTML = '';
    if (!mode) { clearEl.classList.remove('on'); return; }
    clearEl.classList.add('on', mode);
    if (mode === 'logo') {
      try {
        var logo = localStorage.getItem('church-presenter-logo') || '';
        var bg = localStorage.getItem('church-presenter-logo-bg') || '#0a1428';
        clearEl.style.background = bg;
        if (logo) { var img = document.createElement('img'); img.src = logo; img.alt = 'Logo'; clearEl.appendChild(img); }
      } catch (e) {}
    }
  }

  function setFrozen(frozen, requestId) {
    frozen = !!frozen;
    if (frozen && !isFrozen) {
      isFrozen = true;
      document.documentElement.classList.add('audience-frozen');
      frozenMedia = Array.prototype.filter.call(stage.querySelectorAll('video,audio'), function (media) {
        var wasPlaying = !media.paused;
        try { media.pause(); } catch (e) {}
        return wasPlaying ? media : null;
      });
    } else if (!frozen && isFrozen) {
      isFrozen = false;
      document.documentElement.classList.remove('audience-frozen');
      var next = pendingStage; pendingStage = null;
      var nextClear = pendingClear; pendingClear = null;
      if (next) apply(next.html, next.meta);
      if (nextClear !== null) applyClear(nextClear);
      for (var i = 0; i < frozenMedia.length; i++) {
        var media = frozenMedia[i];
        if (media && media.isConnected && !media.hasAttribute('autoplay')) {
          try { var play = media.play(); if (play && play.catch) play.catch(function () {}); } catch (e) {}
        }
      }
      frozenMedia = [];
    }
    try { if (bc) bc.postMessage({ type: 'freeze-ack', frozen: frozen, requestId: requestId || '' }); } catch (e) {}
  }

  function readStorage() {
    try {
      var h = localStorage.getItem('audience-stage-html');
      if (h) apply(h, { bgKey: localStorage.getItem('audience-bg-key') || '' });
    } catch (e) {}
    try { applyClear(localStorage.getItem('audience-clr') || ''); } catch (e) {}
  }

  function waitForFirstSlidePaint() {
    var assets = Array.prototype.slice.call(stage.querySelectorAll('img'))
      .concat(Array.prototype.slice.call(clearEl.querySelectorAll('img')));
    var waits = assets.map(function (img) {
      if (typeof img.decode === 'function') return img.decode().catch(function () {});
      if (img.complete) return Promise.resolve();
      return new Promise(function (resolve) {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
        setTimeout(resolve, 8000);
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll('video'), function (video) {
      if (!video.currentSrc && !video.src) return;
      if (video.readyState >= 2) return;
      waits.push(new Promise(function (resolve) {
        video.addEventListener('loadeddata', resolve, { once: true });
        video.addEventListener('error', resolve, { once: true });
        setTimeout(resolve, 8000);
      }));
    });
    if (document.fonts && document.fonts.ready) {
      waits.push(Promise.race([document.fonts.ready, new Promise(function (resolve) { setTimeout(resolve, 8000); })]));
    }
    return Promise.all(waits).then(function () {
      return new Promise(function (resolve) {
        var timer = setTimeout(resolve, 1000);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { clearTimeout(timer); resolve(); });
        });
      });
    });
  }

  readStorage();
  setInterval(function () { if (gotBc) return; readStorage(); }, 300);
  try { document.body.focus(); } catch (e) {}
  window.addEventListener('load', function () { try { document.body.focus(); } catch (e) {} });
  window.addEventListener('storage', function (e) {
    if (e.key === 'audience-stage-html' && e.newValue) apply(e.newValue, { bgKey: localStorage.getItem('audience-bg-key') || '' });
    if (e.key === 'audience-clr') applyClear(e.newValue || '');
  });

  try {
    bc = new BroadcastChannel('church-presenter-audience');
    bc.onmessage = function (e) {
      var d = e.data; if (!d) return;
      if (d.type === 'freeze') { setFrozen(d.frozen, d.requestId); return; }
      if (d.type === 'stage') { gotBc = true; apply(d.html, { sameBg: d.sameBg, bgKey: d.bgKey }); }
      if (d.type === 'clear') applyClear(d.mode || '');
      if (d.type === 'play-embed') playEmbeddedById(d.elId);
      if (d.type === 'preload-bgs' && d.list) {
        for (var i = 0; i < d.list.length; i++) warmBg(d.list[i].key, d.list[i].url);
      }
    };
    waitForFirstSlidePaint().then(function () {
      bc.postMessage({ type: 'ready', presentId: presentId });
    });
  } catch (e) {}

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'audience-stage') { gotBc = true; apply(e.data.html, { sameBg: e.data.sameBg, bgKey: e.data.bgKey }); }
    if (e.data && e.data.type === 'audience-clear') applyClear(e.data.mode || '');
    if (e.data && e.data.type === 'play-embed') playEmbeddedById(e.data.elId);
    if (e.data && e.data.type === 'preload-bgs' && e.data.list) {
      for (var i = 0; i < e.data.list.length; i++) warmBg(e.data.list[i].key, e.data.list[i].url);
    }
  });

  function sendControl(action, key) {
    var payload = { type: 'control', action: action, key: key || '', t: Date.now() };
    try { if (bc) bc.postMessage(payload); } catch (e) {}
    try { localStorage.setItem('audience-control', JSON.stringify(payload)); } catch (e) {}
  }
  function onKey(e) {
    var k = e.key, lower = k.length === 1 ? k.toLowerCase() : k;
    if (k === 'Escape') { e.preventDefault(); sendControl('end'); return; }
    if (lower === 'b') { e.preventDefault(); sendControl('toggle-clear', 'black'); return; }
    if (lower === 'w') { e.preventDefault(); sendControl('toggle-clear', 'white'); return; }
    if (lower === 'l') { e.preventDefault(); sendControl('toggle-clear', 'logo'); return; }
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown') { e.preventDefault(); sendControl('next'); return; }
    if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); sendControl('prev'); return; }
  }
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('keydown', onKey, true);
  document.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var v = e.target.closest && e.target.closest('video.slide-video');
    if (v) { e.preventDefault(); e.stopPropagation(); if (v.paused) v.play().catch(function(){}); else v.pause(); return; }
    var seq = stage.querySelector('video.slide-video[data-video-clickseq="1"]');
    if (seq && seq.paused) { e.preventDefault(); e.stopPropagation(); seq.play().catch(function(){}); return; }
    sendControl('next');
  });
})();
</script>
</body>
</html>
